name: Build & Release APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decrypt fixed signing key
        env:
          TS_KEY_PASS: ${{ secrets.TS_KEY_PASS }}
        run: |
          test -n "$TS_KEY_PASS" || { echo "::error::Secret TS_KEY_PASS is missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore.enc -out app/release.p12 -pass env:TS_KEY_PASS
      - name: Build signed release APK
        env:
          TS_KEY_PASS: ${{ secrets.TS_KEY_PASS }}
          TS_KEYSTORE: ${{ github.workspace }}/android/app/release.p12
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
      - name: Version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "../QuickLink-v${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: QuickLink-apk
          path: QuickLink-*.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Quick Link v${{ steps.ver.outputs.name }}
          body_path: android/RELEASE_NOTES.md
          files: QuickLink-*.apk
          make_latest: true
