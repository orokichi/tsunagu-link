<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3f3fa" />
  <meta name="description" content="Quick Link — PC と Android をつなぐ連携アプリ" />
  <title>Quick Link — PC とスマホをつなぐ</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quick Link" />
  <!--
    Startup: nothing here may block the first paint.
    The web fonts (Google Sans Flex / Noto Sans JP, plus the Material Symbols icon
    font) are fetched asynchronously — a <link rel=stylesheet> would hold the whole
    first render until the network answers, which is what made a Chromebook cold
    start feel slow. The inline block below paints the surface colour and the app
    mark immediately from the cache, so the window is never blank.
  -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block" />
  </noscript>
  <style>
    :root { color-scheme: light dark; --boot-bg: #f3f3fa; --boot-fg: #1b1b21; --boot-tint: #3f6df2 }
    @media (prefers-color-scheme: dark) { :root { --boot-bg: #131318; --boot-fg: #e6e1e9; --boot-tint: #b6c4ff } }
    html, body { height: 100%; margin: 0; background: var(--boot-bg); color: var(--boot-fg) }
    #root { height: 100% }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--boot-bg) }
    .boot img { width: 72px; height: 72px; animation: boot-in .5s cubic-bezier(.34,1.56,.64,1) both }
    .boot span { font: 700 20px/1 system-ui, sans-serif; letter-spacing: -.01em; opacity: .8 }
    .boot i { display: block; width: 42px; height: 4px; border-radius: 2px; background: var(--boot-tint); opacity: .25; animation: boot-pulse 1.2s ease-in-out infinite }
    @keyframes boot-in { from { opacity: 0; transform: scale(.86) } }
    @keyframes boot-pulse { 50% { opacity: .6; width: 64px } }
  </style>
</head>
<body>
  <div id="root"><div class="boot"><img src="/icon.svg" alt="" /><span>Quick Link</span><i></i></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
